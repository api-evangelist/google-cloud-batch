      name: listjobs
      operations:
      - method: GET
        name: listjobs
        description: Google Cloud Batch List Jobs
        call: google-cloud-batch.listjobs
        with:
          project: rest.project
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
