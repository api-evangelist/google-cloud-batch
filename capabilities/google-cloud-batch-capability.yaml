    namespace: google-cloud-batch
    baseUri: https://batch.googleapis.com/v1
    description: Google Cloud Batch API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_CLOUD_BATCH_TOKEN}}'
    resources:
    - name: projects-project-locations-location-jobs
      path: /projects/{project}/locations/{location}/jobs
      operations:
      - name: listjobs
        method: GET
        description: Google Cloud Batch List Jobs
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createjob
        method: POST
        description: Google Cloud Batch Create Job
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: jobId
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-jobs-jobid
      path: /projects/{project}/locations/{location}/jobs/{jobId}
      operations:
      - name: getjob
        method: GET
        description: Google Cloud Batch Get Job
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletejob
        method: DELETE
        description: Google Cloud Batch Delete Job
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-jobs-jobid-t
      path: /projects/{project}/locations/{location}/jobs/{jobId}/taskGroups/{taskGroupId}/tasks
      operations:
      - name: listtasks
        method: GET
        description: Google Cloud Batch List Tasks
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
        - name: taskGroupId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-jobs-jobid-t
      path: /projects/{project}/locations/{location}/jobs/{jobId}/taskGroups/{taskGroupId}/tasks/{taskId}
      operations:
      - name: gettask
        method: GET
        description: Google Cloud Batch Get Task
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
        - name: taskGroupId
          in: path
          type: string
          required: true
        - name: taskId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
