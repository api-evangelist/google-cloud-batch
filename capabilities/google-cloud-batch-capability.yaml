naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Batch API
  description: Manages batch processing workloads on Google Cloud, including job creation, scheduling, task execution, and
    resource provisioning.
  tags:
  - Google
  - Cloud
  - Batch
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
